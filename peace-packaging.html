            <div id="title"><figcaption><span><a href="design.html">DESIGN • </a></span>FIND YOUR INNER PEACE</figcaption><figcaption id="date">FALL 2025</figcaption></div>
            <hr>
            <img class="top" src="photos/peace.jpg" />
            <figcaption>Conceptual packaging for the assigned emotion ‘peace’. For this packaging, I decided to focus on peace as more of an inner feeling rather than an external force. I defined it as a tranquil, internal state that focuses on self-acceptance and being one with nature.
            <br><br>Because I was aiming to package inner peace, I wanted my packaging to feature a meditative journey towards finding peace within. I didn't want the outside of the box to be obtrusive so that the focus could be on what's inside. I decided that a layering approach would fit this type of implementation, so I designed my packaging using a storytelling, shadow-box technique. Each layer is dedicated to finding a different kind of inner peace (mind, body, and soul) and has illustrative scenery that correlates with it (sky, trees, and meadow). After going through each layer, there are three internal cigarette-reminiscent aromatherapy “scent” boxes at the bottom that are each associated with those types of inner peace.
            <br><br>For my visual language, I used a combination of nature imagery, flat colors, and gradients that implemented a simple, pastel, earthy color palette. I wanted my typography to reflect this grounded but delicate quality, so I chose minimalistic, lightweight typefaces that featured rounded and flowy letterforms and had a sense of breathability.
            <br><br>Because my packaging was a box with layered cutouts, I chose to use paper from a plotter and make it even thicker by gluing pieces together to make it double-sided. I felt that this material would allow the user to interact with the packaging like flipping the pages of a book while also allowing the box to have a sturdier structure than regular paper would supply.
            </figcaption>
