<main>
    <div id="thumbnails">
        <figure>
            <div id="title"><figcaption><span><a href="design.html">DESIGN • </a></span>DO YOU STILL BELIEVE IN MAGIC?</figcaption><figcaption id="date">FALL 2026</figcaption></div>
            <hr>
            <img class="top poster" src="photos/6-words-copy.jpeg" onclick="zoom(this.src)"/>
            <figcaption>This project focuses on the relationship between type and image to convey a six-word story. I came up with the story, <i>"do you still believe in magic?"</i>, and chose to phrase it as a question to encourage the audience to contemplate their own beliefs and how they may have changed with age.
                <br><br>The photograph I used is a picture I took of my backyard, as nature is where I felt magic most when I was a kid. To integrate the typography with that environment, I rendered the word 'magic' to look like stones embedded in the grass.
                <br><br>My overall design choices, especially in regard to the image treatment, were informed by wanting to evoke a dreamlike quality and the feeling of something old and forgotten; weathered with time but well-loved; waiting to be rediscovered.</figcaption>
            <br>
            <figcaption><span style="color:#7C9885; font-weight:lighter;">𖦹</span> <mark>SKILLS:</mark> Poster Design, Typography, GIF</figcaption>
            <figcaption><span style="color:#7C9885; font-weight:lighter;">𖦹</span> <mark>SOFTWARE:</mark> Adobe Photoshop, Illustrator</figcaption>
            <br>
            <hr>
            <figcaption style="text-align: center;">GIF</figcaption>
            <hr>
            <img class="top poster" src="photos/6-words copy.gif" onclick="zoom(this.src)"/>
            <figcaption>For the GIF version of the poster, I made the word 'magic' to dissolve into the grass and emerge back above the surface to reflect how magic is evanescent. I also animated the tittles to sparkle subtly, but, as with magic, you have to believe it's there and look closely to see it.</figcaption>
        </figure>
