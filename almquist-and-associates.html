            <figcaption>For this text-heavy about page, I focused on creating a dynamic layout while adhering to the brand guidelines. To keep the information visually engaging, I defined a detailed type hierarchy and included breaks in the page with important quote blocks. When replacing the filler text in the wireframe, I ended up reorganizing the page a bit to provide a better narrative flow.
                <br><br>The page begins with the background and context of the project, then the three main points of what the website provides in the form of a card trio, and finally who it benefits and what its values are as drop-downs. To diversify the presentation of information on the page, I made sure to include interactive elements such as the redirective buttons on the cards and the expandable/collapsible menu for the values section.</figcaption>
